# Workflow GitHub Actions pour la CI
name: CI

# Déclenche le workflow sur les pushes et PRs vers master
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  quality:
    # Exécute sur un serveur Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du repo
      - uses: actions/checkout@v4

      # Installe Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installe les dépendances du projet
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Vérifie le formatage du code avec black
      - name: black
        run: black --check .

      # Vérifie l'ordre des imports avec isort
      - name: isort
        run: isort --check-only .

      # Vérifie la cohérence des types avec mypy
      - name: mypy
        run: mypy ingestion tests

      # Lance les tests unitaires
      - name: pytest (unit)
        run: pytest tests/unit/ -v

      # NOTE: Tests d'intégration temporairement désactivés en CI
      # Raison: dépendance à des téléchargements externes (INSEE, GTFS, GPE)
      # qui sont fragiles en CI (blocages, timeouts, etc.)
      #
      # Tests d'intégration disponibles localement:
      # - Ils passent avec une vraie base PostgreSQL locale (gpe_test)
      # - Utiles pour développement et vérification avant merge
      #
      # À faire: créer des fixtures de test pour les fichiers externes
      # et ajouter les tests d'intégration au CI avec une infrastructure robuste
      #
      # - name: pytest (integration)
      #   run: pytest tests/integration/ -v
      #   env:
      #     DATABASE_URL: postgresql://gpe:gpe@localhost:5432/gpe_test
