models:
  - name: stg_insee_communes
    description: "Communes IDF avec indicateurs socio-économiques INSEE 2022"
    columns:
      - name: code_commune
        tests:
          - not_null
          - unique

      - name: population
        tests:
          - not_null:
              config:
                severity: warn

      - name: taux_chomage
        description: >
          Taux de chômage des 15-64 ans = nb_chomeurs / nb_actifs, calculé une
          seule fois à l'ingestion. Ratio entre 0 et 1 (8,7 % = 0,087) ;
          l'affichage en % est fait par le dashboard. Plage vérifiée par
          tests/assert_taux_chomage_entre_0_et_1.sql.

  - name: stg_gtfs_stops
    description: >
      Zones d'arrêt IDFM (location_type = 1) : une station = une ligne.
      Les quais (0) et les entrées/sorties (2) sont exclus, car ils comptaient
      la même station plusieurs fois (environ 3,6 fois en moyenne, décision #6).
    columns:
      - name: stop_id
        tests:
          - not_null
          - unique

      - name: location_type
        description: "Toujours 1 (zone d'arrêt). Le test casse si le filtre est retiré."
        tests:
          - accepted_values:
              values: [1]
