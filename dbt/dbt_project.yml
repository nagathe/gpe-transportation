name: 'gpe'
version: '1.0.0'
config-version: 2

profile: 'gpe'

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  gpe:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: mart
      +materialized: table

vars:
  rayon_gpe_metres: 2000
  # Seuils en zones d'arrêt pour 10 000 habitants (stg_gtfs_stops, décision #6).
  # Recalibrés pour garder la même part de communes qu'avec l'ancien comptage
  # (10 et 50 arrêts, qui comptaient chaque station ~3,6 fois) :
  # 174 communes sous 2,76 et 663 sous 16,37, sur 1 285.
  seuil_sous_desserte: 2.76
  seuil_gain_modere: 16.37
  # Pas de seuils de revenu : les quartiles sont calculés sur les données
  # (quartiles d'habitants, voir precarite_vs_mobilite.sql, #36).
